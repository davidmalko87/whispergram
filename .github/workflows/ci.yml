name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    name: Lint & test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install tooling
        # faster-whisper is intentionally NOT installed here. The merge/mapping logic is
        # pure and tested offline; the transcription dependency is only needed at runtime
        # by end users. Skipping it keeps CI fast and proves the module imports without it.
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest

      - name: Lint with ruff
        run: ruff check .

      - name: Verify the module imports without transcription deps
        run: |
          python -c "import whispergram; print('version:', whispergram.__version__)"
          python -c "from whispergram import build_transcript, extract_text, media_marker"

      - name: Run tests
        run: pytest -q

      - name: Dry-run smoke test on the sample fixture
        run: |
          python whispergram.py --dry-run tests/fixtures/sample_export --out /tmp/merged.md
          cat /tmp/merged.md

      - name: Verify CLI help loads
        run: python whispergram.py --help

  package:
    name: Build, check and install the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      - name: Install the wheel and run the console script
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl
          cd /tmp && /tmp/wheel-venv/bin/whispergram --help

      - name: Decode audio through the installed faster-whisper (catches PyAV breaks)
        run: |
          /tmp/wheel-venv/bin/python - <<'PY'
          import math, struct, wave
          with wave.open("/tmp/tone.wav", "wb") as w:
              w.setnchannels(1); w.setsampwidth(2); w.setframerate(16000)
              w.writeframes(b"".join(struct.pack("<h", int(8000 * math.sin(2 * math.pi * 440 * i / 16000))) for i in range(16000)))
          from faster_whisper.audio import decode_audio
          samples = decode_audio("/tmp/tone.wav")
          assert len(samples) > 0
          print("decoded samples:", len(samples))
          PY
